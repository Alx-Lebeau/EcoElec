# Configuration commune au poly et aux slides.
#
# Deux profils exclusifs :
#   quarto render --profile poly     → livre (HTML + PDF), _rendu/poly/
#   quarto render --profile slides   → decks générés par `ecoelec generer`, _rendu/slides/
# Profil d'appoint, à combiner avec slides :
#   --profile slides,autonome        → decks en un seul fichier HTML, utilisables hors connexion
# Profil des outils interactifs (pages OJS des modules) :
#   quarto render --profile outils   → _rendu/outils/

project:
  output-dir: _rendu

profile:
  group:
    - [poly, slides, outils]

lang: fr
# Adresse du site publié (GitHub Pages, voir `ecoelec site`) : liens absolus des
# slides vers les outils, valables aussi dans les decks autonomes et les PDF.
site-cours: https://alx-lebeau.github.io/EcoElec
bibliography: commun/biblio.bib

jupyter: python3

execute:
  freeze: auto   # un nouveau rendu ne réexécute que les documents modifiés
  echo: false
  warning: false
