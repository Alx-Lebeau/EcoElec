# Rendu complet à chaque push : tests, poly (HTML + PDF), slides (decks des parcours,
# base, intégrale et vue auteur de chaque module), decks autonomes et PDF, outils
# interactifs (OJS), contrôles.
# Le rendu est disponible en artefact « rendu » de chaque exécution.
# Sur main, le site est publié sur GitHub Pages (job « publier ») : _rendu/ en est la
# racine (accueil, adresses courtes des parcours, poly, slides, outils). Prérequis :
# Settings > Pages > Source : « GitHub Actions » (dépôt public ou offre payante).

name: Rendu

on:
  push: # couvre aussi les pull requests ouvertes depuis une branche du dépôt
  workflow_dispatch:

concurrency:
  group: rendu-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTO_VERSION: "1.11.9"

defaults:
  run:
    shell: bash # bash -eo pipefail : un échec avant `| tee` fait échouer l'étape

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Environnement Python (versions figées par uv.lock)
        run: uv sync --locked

      - name: Installer Quarto et TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}
          tinytex: true

      # Node : test des modèles JavaScript des outils contre pyelec (obligatoire en CI,
      # voir tests/test_modele_js.py), et decktape pour les PDF des decks.
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests de l'outillage et des modèles des outils
        run: uv run pytest

      - name: Vérifier modules et parcours, générer les decks
        run: uv run ecoelec generer

      # Résultats de calcul (freeze) : non versionnés, conservés d'une exécution à
      # l'autre tant que le code, les données et les sources ne changent pas.
      # Pas de restore-keys : un cache partiel pourrait servir des résultats
      # périmés aux chapitres du poly, qui n'ont pas d'empreinte.
      - name: Cache des résultats de calcul
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ hashFiles('uv.lock', 'pyelec/**', 'data/**', 'modules/**', 'parcours/**', 'commun/**', 'outils/**', 'index.qmd', '_quarto*.yml') }}

      - name: Poly (HTML + PDF)
        run: uv run quarto render --profile poly 2>&1 | tee poly.log

      - name: Slides
        run: uv run quarto render --profile slides 2>&1 | tee slides.log

      - name: Outils interactifs (OJS)
        run: uv run quarto render --profile outils 2>&1 | tee outils.log

      - name: Decks des parcours en HTML autonome
        run: >-
          uv run quarto render decks/parcours --profile slides,autonome
          --output-dir _rendu/autonome 2>&1 | tee autonome.log

      - name: Test des decks autonomes avec maths et graphique interactif (module d'exemple)
        run: >-
          uv run quarto render decks/modules/exemple --profile slides,autonome
          --output-dir _rendu/autonome 2>&1 | tee autonome-exemple.log

      - name: Decks des parcours en PDF
        run: uv run ecoelec pdf

      - name: Racine du site (accueil, adresses courtes des parcours)
        run: uv run ecoelec site

      - name: Contrôles (renvois masqués, références et images manquantes)
        run: uv run ecoelec controler poly.log slides.log outils.log autonome.log autonome-exemple.log

      - name: Déposer le rendu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendu
          path: |
            _rendu/
            *.log
          retention-days: 30

      - name: Préparer la publication (main seulement)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _rendu

  publier:
    needs: rendu
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    # Un seul déploiement à la fois, sans annuler celui en cours.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
