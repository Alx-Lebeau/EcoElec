# Profil « outils » : pages interactives (Observable JS) des modules, une par outil.
# Sources : modules/<id>/outil.qmd. Le modèle JavaScript de chaque outil est à côté
# (modules/<id>/modele.js) et reproduit le code Python de pyelec (tests/test_modele_js.py).

project:
  type: website
  output-dir: _rendu/outils
  render:
    - modules/*/outil.qmd

website:
  favicon: commun/logo.svg
  title: "Économie de l'électricité — outils"
  # Barre de navigation commune au poly et aux outils, reprise de l'en-tête de
  # l'accueil React (accueil/src/App.jsx) : garder les trois identiques.
  navbar:
    title: "Économie de l'électricité"
    logo: commun/logo.svg
    logo-href: ../index.html
    left:
      - text: Parcours
        href: ../index.html#/parcours
      - text: Modules
        href: ../index.html#/modules
      - text: Outils
        href: ../index.html#/outils
      - text: Poly
        href: ../poly/index.html

filters:
  - commun/filtres/typographie.lua

format:
  html:
    # Quarto empile les couches scss:defaults en ordre inverse : la charte, listée en
    # dernier, est déclarée en premier (voir commun/README.md).
    # Mode clair seulement : les graphiques des outils ont des couleurs écrites pour
    # un fond clair (traits, aplats, tableaux). Mode sombre à ajouter quand ils
    # suivront le thème.
    theme: [cosmo, commun/site.scss, commun/charte.scss]
    css: commun/polices/polices.css
    page-layout: full
    toc: false
