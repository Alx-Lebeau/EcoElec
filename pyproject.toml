[project]
name = "ecoelec"
version = "0.1.0"
description = "Cours d'économie de l'électricité : code partagé (pyelec) et outillage du cours (outils)"
readme = "README.md"
authors = [{ name = "Alexis Lebeau" }]
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
requires-python = ">=3.12"
dependencies = [
    # Exécution des cellules Python par Quarto
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    # Calcul, figures, optimisation
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=6.0",
    "pulp>=3.0",
    "highspy>=1.8",
    # Lecture des modules et des parcours
    "pyyaml>=6.0",
]

[project.scripts]
ecoelec = "outils.cli:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyelec", "outils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["_freeze", "_rendu", "decks"]
