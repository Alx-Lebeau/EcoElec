# Profil « poly » : livre unique et complet, en HTML et en PDF.
# Un chapitre par module, dans l'ordre de la banque de modules.

project:
  type: book
  output-dir: _rendu/poly

book:
  favicon: commun/logo.svg
  title: "Économie de l'électricité"
  subtitle: "Marchés, analyse économique et modélisation"
  author: Alexis Lebeau
  date: last-modified
  date-format: long
  output-file: economie-electricite
  # Barre de navigation commune au poly et aux outils, reprise de l'en-tête de
  # l'accueil React (accueil/src/App.jsx) : garder les trois identiques.
  navbar:
    title: "Économie de l'électricité"
    logo: commun/logo.svg
    logo-href: ../index.html
    left:
      - text: Parcours
        href: ../index.html#/parcours
      - text: Modules
        href: ../index.html#/modules
      - text: Outils
        href: ../index.html#/outils
      - text: Poly
        href: ../poly/index.html
  chapters:
    - index.qmd
    - modules/systeme/poly.qmd
    - modules/cadre/poly.qmd
    - modules/court-terme/poly.qmd
    - modules/long-terme/poly.qmd
    - modules/cas-enr-investissement/poly.qmd
    - modules/architecture-marches/poly.qmd
    - modules/capacite/poly.qmd
    - modules/reseaux/poly.qmd
    - modules/nucleaire/poly.qmd
    - modules/enr-flexibilites/poly.qmd
    - modules/market-design-ue/poly.qmd
    - modules/crise-2022/poly.qmd
    - references.qmd

filters:
  - path: commun/filtres/formalisation.lua
    at: pre-ast
  - commun/filtres/typographie.lua

number-sections: true
crossref:
  chapters: true

format:
  html:
    # Quarto empile les couches scss:defaults en ordre inverse : la charte, listée en
    # dernier, est déclarée en premier (voir commun/README.md).
    theme:
      light: [cosmo, commun/site.scss, commun/charte.scss]
      dark: [cosmo, commun/site.scss, commun/site-sombre.scss, commun/charte.scss]
    respect-user-color-scheme: true
    css: commun/polices/polices.css
    toc-depth: 3
  pdf:
    documentclass: scrbook
    papersize: a4
    toc-depth: 2
    colorlinks: true
